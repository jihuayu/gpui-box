[package]
name = "gpui-box-rendering-perf"
default-run = "gpui-box-rendering-perf"
description = "Source-backed CPU experiments for the retained-rendering RFC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
gpui-scene = ["dep:gpui"]
gpu-backend = ["gpui-scene", "dep:gpui_wgpu"]
gpu-prototype = ["gpu-backend", "gpui_wgpu/quad-patch-prototype", "dep:serde_json"]
retained-gpu = ["dep:gpui-box", "gpui-box/retained-wgpu", "dep:serde_json", "retained-text"]
retained-diagnostics = ["retained-gpu", "gpui-box/retained-diagnostics"]
retained-runtime = ["dep:gpui-box", "gpui-box/retained", "dep:serde_json"]
retained-text = ["retained-runtime", "gpui-box/retained-text", "gpu-backend"]

[dependencies]
gpui = { workspace = true, optional = true }
gpui-box = { workspace = true, optional = true }
gpui_wgpu = { path = "../../vendor/gpui/crates/gpui_wgpu", optional = true }
serde_json = { version = "1", optional = true }
# Match the pinned GPUI version and layout features, including disabled rounding
# in the normal cases. The rounding case is a separately labelled control.
taffy = { version = "=0.15.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout", "content_size"] }

[lints]
workspace = true

[[bin]]
name = "software-runtime-perf"
path = "src/software.rs"
required-features = ["retained-runtime"]

[[bin]]
name = "dense-runtime-perf"
path = "src/dense.rs"
required-features = ["retained-gpu"]

[[bin]]
name = "quad-patch-gpu"
path = "src/gpu.rs"
required-features = ["gpu-prototype"]

[[bin]]
name = "retained-runtime-gpu"
path = "src/retained_gpu.rs"
required-features = ["retained-gpu"]

[[bin]]
name = "reactive-runtime-perf"
path = "src/reactive.rs"
required-features = ["retained-runtime"]

[[bin]]
name = "delivery-runtime-perf"
path = "src/delivery.rs"
required-features = ["retained-runtime"]

[[bin]]
name = "computed-runtime-perf"
path = "src/computed.rs"
required-features = ["retained-runtime"]

[[bin]]
name = "measure-runtime-perf"
path = "src/measure.rs"
required-features = ["retained-runtime"]

[[bin]]
name = "property-runtime-perf"
path = "src/properties.rs"
required-features = ["retained-runtime"]

[[bin]]
name = "layout-publication-perf"
path = "src/layout_publication.rs"
required-features = ["retained-runtime"]

[[bin]]
name = "paragraph-runtime-perf"
path = "src/paragraph.rs"
required-features = ["retained-text"]
