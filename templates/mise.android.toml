[tools]
java = "temurin-17.0.21+9"
gradle = "8.13"
"cargo:cargo-ndk" = "4.1.2"
[tasks."build:android"]
run = "java -classpath android-host/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p android-host :app:assembleDebug"
[tasks."install:android"]
run = "java -classpath android-host/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p android-host :app:installDebug"
