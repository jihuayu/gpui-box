[package]
name = "gpui-box"
description = "A coordinated GPUI distribution for desktop and mobile applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
updates = ["system", "app-data", "dep:gpui-updates"]
diagnostics = ["system", "app-data", "files", "dep:gpui-diagnostics"]
diagnostics-gpui = ["diagnostics", "system-gpui", "files-gpui", "gpui-diagnostics/gpui"]
menus = ["system", "permissions", "activation", "dep:gpui-menus"]
menus-gpui = ["menus", "system-gpui", "permissions-gpui", "activation-gpui", "gpui-menus/gpui"]
power = ["system", "lifecycle", "permissions", "dep:gpui-power"]
power-gpui = ["power", "system-gpui", "lifecycle-gpui", "permissions-gpui", "gpui-power/gpui"]
tray = ["system", "lifecycle", "menus", "dep:gpui-tray"]
dnd = ["system", "clipboard", "files", "lifecycle", "dep:gpui-dnd"]
dnd-gpui = ["dnd", "system-gpui", "files-gpui", "lifecycle-gpui", "gpui-dnd/gpui"]
tray-gpui = ["tray", "system-gpui", "lifecycle-gpui", "menus-gpui", "gpui-tray/gpui"]
task-presentation = ["system", "lifecycle", "menus", "notifications", "dep:gpui-task-presentation"]
network = ["system", "lifecycle", "secrets", "dep:gpui-network"]
network-gpui = ["network", "system-gpui", "lifecycle-gpui", "gpui-network/gpui"]
jobs = ["system", "app-data", "lifecycle", "permissions", "power", "network", "dep:gpui-jobs"]
jobs-gpui = ["jobs", "system-gpui", "lifecycle-gpui", "permissions-gpui", "power-gpui", "network-gpui", "gpui-jobs/gpui"]
task-presentation-gpui = ["task-presentation", "system-gpui", "lifecycle-gpui", "menus-gpui", "notifications-gpui", "gpui-task-presentation/gpui"]
sharing = ["system", "dep:gpui-sharing"]

clipboard = ["system", "dep:gpui-clipboard"]
system = ["dep:gpui-system"]
secrets = ["system", "dep:gpui-secrets"]
local-auth = ["system", "lifecycle", "secrets", "dep:gpui-local-auth"]
local-auth-gpui = ["local-auth", "system-gpui", "lifecycle-gpui", "gpui-local-auth/gpui"]
auth = ["system", "activation", "secrets", "permissions", "lifecycle", "dep:gpui-auth"]
auth-gpui = ["auth", "system-gpui", "activation-gpui", "permissions-gpui", "lifecycle-gpui", "gpui-auth/gpui"]
app-data = ["system", "dep:gpui-app-data"]
lifecycle = ["system", "dep:gpui-lifecycle"]
lifecycle-gpui = ["lifecycle", "system-gpui", "gpui-lifecycle/gpui"]
system-gpui = ["system", "gpui-system/gpui"]
activation = ["system", "dep:gpui-activation"]
activation-gpui = ["activation", "system-gpui", "gpui-activation/gpui"]
notifications = ["system", "app-data", "permissions", "activation", "dep:gpui-notifications"]
notifications-gpui = ["notifications", "system-gpui", "permissions-gpui", "activation-gpui", "gpui-notifications/gpui"]
permissions = ["system", "dep:gpui-permissions"]
permissions-gpui = ["permissions", "system-gpui", "gpui-permissions/gpui"]
accessibility = ["system", "dep:gpui-accessibility"]
accessibility-gpui = ["accessibility", "system-gpui", "gpui-accessibility/gpui"]
files = ["system", "app-data", "dep:gpui-files"]
files-gpui = ["files", "system-gpui", "gpui-files/gpui"]
android = ["dep:gpui", "dep:gpui-android"]
desktop = ["dep:gpui", "dep:gpui_platform", "gpui_platform/font-kit", "gpui_platform/wayland", "gpui_platform/x11"]

[dependencies]
gpui-sharing = { workspace = true, optional = true }

gpui-clipboard = { workspace = true, optional = true }
gpui-dnd = { workspace = true, optional = true }
gpui-secrets = { workspace = true, optional = true }
gpui-activation = { workspace = true, optional = true }
gpui-notifications = { workspace = true, optional = true }
gpui-app-data = { workspace = true, optional = true }
gpui-lifecycle = { workspace = true, optional = true }
gpui-system = { workspace = true, optional = true }
gpui-permissions = { workspace = true, optional = true }
gpui-accessibility = { workspace = true, optional = true }
gpui-files = { workspace = true, optional = true }
gpui-local-auth = { workspace = true, optional = true }
gpui-auth = { workspace = true, optional = true }
gpui-updates = { workspace = true, optional = true }
gpui-diagnostics = { workspace = true, optional = true }
gpui-menus = { workspace = true, optional = true }
gpui-power = { workspace = true, optional = true }
gpui-tray = { workspace = true, optional = true }
gpui-task-presentation = { workspace = true, optional = true }
gpui-network = { workspace = true, optional = true }
gpui-jobs = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
gpui = { workspace = true, optional = true }
gpui-android = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui-box-components = { path = "../../components/gpui-box-components" }

[lints]
workspace = true

[[example]]
name = "settings"
required-features = ["app-data"]

[[example]]
name = "activation"
required-features = ["activation", "app-data"]
