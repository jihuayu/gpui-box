[package]
name = "gpui-task-presentation"
description = "Taskbar, Dock, badge and notification task-presentation adapters for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
gpui = [
    "dep:gpui",
    "gpui-system/gpui",
    "gpui-lifecycle/gpui",
    "gpui-menus/gpui",
    "gpui-notifications/gpui",
]

[dependencies]
gpui-system = { workspace = true }
gpui-lifecycle = { workspace = true }
gpui-menus = { workspace = true }
gpui-notifications = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gpui = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0"
gpui-permissions = { workspace = true }
gpui-activation = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
