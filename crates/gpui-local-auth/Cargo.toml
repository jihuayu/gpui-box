[package]
name = "gpui-local-auth"
description = "Local user verification, protected-key signing and protected-secret release for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
gpui = ["dep:gpui", "gpui-system/gpui", "gpui-lifecycle/gpui"]

[dependencies]
gpui-system = { workspace = true }
gpui-lifecycle = { workspace = true }
gpui-secrets = { workspace = true }
zeroize = "1.9"
gpui = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
