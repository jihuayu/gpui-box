[package]
name = "gpui-auth"
description = "Browser account authentication, OAuth/OIDC PKCE, Passkey and secret-backed session contracts for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
gpui = ["dep:gpui", "gpui-system/gpui", "gpui-activation/gpui", "gpui-lifecycle/gpui", "gpui-permissions/gpui"]

[dependencies]
gpui-system = { workspace = true }
gpui-activation = { workspace = true }
gpui-secrets = { workspace = true }
gpui-permissions = { workspace = true }
gpui-lifecycle = { workspace = true }
gpui = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
