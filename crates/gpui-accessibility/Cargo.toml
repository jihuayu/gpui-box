[package]
name = "gpui-accessibility"
description = "AccessKit semantic inventory, scene correlation, audits and assistive-technology acceptance for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
gpui = ["dep:gpui", "gpui-system/gpui"]

[dependencies]
gpui-system = { workspace = true }
accesskit = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gpui = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
