[package]
name = "gpui-push"
description = "Remote push providers, device registration and bounded message routing for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
gpui = ["dep:gpui", "gpui-system/gpui", "gpui-permissions/gpui"]

[dependencies]
gpui-system = { workspace = true }
gpui-app-data = { workspace = true }
gpui-permissions = { workspace = true }
gpui-secrets = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
gpui = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
