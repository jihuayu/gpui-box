[package]
name = "gpui-sharing"
description = "Explicit native text and link sharing for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gpui-system.workspace = true
gpui-activation.workspace = true
gpui-files.workspace = true
gpui-app-data.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[features]
gpui-example = ["dep:gpui", "dep:gpui_platform", "dep:raw-window-handle"]

[target.'cfg(target_os = "windows")'.dependencies.gpui]
workspace = true
optional = true

[target.'cfg(target_os = "windows")'.dependencies.gpui_platform]
workspace = true
optional = true

[target.'cfg(target_os = "windows")'.dependencies.raw-window-handle]
version = "0.6"
optional = true

[[example]]
name = "windows_share"
required-features = ["gpui-example"]
