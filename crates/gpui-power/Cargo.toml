[package]
name = "gpui-power"
description = "Power, session and thermal observations with lifecycle-bound wake-prevention leases for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
gpui = ["dep:gpui", "gpui-system/gpui", "gpui-lifecycle/gpui", "gpui-permissions/gpui"]

[dependencies]
gpui-system = { workspace = true }
gpui-lifecycle = { workspace = true }
gpui-permissions = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
gpui = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
