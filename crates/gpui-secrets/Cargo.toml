[package]
name = "gpui-secrets"
description = "Account-scoped secure credential storage for gpui-box"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gpui-system.workspace = true
zeroize = "1.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# Native FFI is confined to windows.rs; safe modules retain deny(unsafe_code).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
