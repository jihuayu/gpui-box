<!doctype html>
<meta charset="utf-8">
<title>Explicit scrollbar allocation and Flex reference</title>
<style>
html,body{margin:0;padding:0}
.host{position:absolute;left:0;top:0;display:flex;width:80px;height:60px;padding:3px;border:2px solid transparent;gap:2px;align-items:flex-start;align-content:flex-start;justify-content:flex-start}
.host::-webkit-scrollbar{width:var(--gutter);height:var(--gutter)}
.host>div{flex-shrink:0}
</style>
<body>
<script>
window.referenceReady=(async()=>{
  const cases=[];
  for(const direction of ['row','row-reverse','column','column-reverse'])
  for(const wrap of ['nowrap','wrap','wrap-reverse'])
  for(const rtl of [false,true])
  for(const gutter of [0,6,12])
  for(const overflow of ['vertical','both'])
  for(const model of ['border-box','content-box']) {
    const host=document.createElement('div');host.className='host';
    Object.assign(host.style,{flexDirection:direction,flexWrap:wrap,direction:rtl?'rtl':'ltr',boxSizing:model,
      overflowX:overflow==='both'?'scroll':'hidden',overflowY:'scroll'});
    host.style.setProperty('--gutter',`${gutter}px`);
    for(const [w,h] of [[40,20],[30,16],[20,22]]) {
      const child=document.createElement('div');child.style.width=`${w}px`;child.style.height=`${h}px`;host.append(child);
    }
    document.body.append(host);const rect=host.getBoundingClientRect();
    const actual=[rect.width,rect.height,host.clientWidth-6,host.clientHeight-6,
      ...[...host.children].flatMap(child=>{const r=child.getBoundingClientRect();return[r.x-rect.x,r.y-rect.y,r.width,r.height]})];
    cases.push({direction,wrap,rtl,gutter,overflow,model,actual});host.remove();
  }
  return{userAgent:navigator.userAgent,cases};
})();
</script>
