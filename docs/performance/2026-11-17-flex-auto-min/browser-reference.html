<!doctype html>
<meta charset="utf-8">
<title>Flex automatic minimum size reference</title>
<style>body { margin:0 } .host { display:flex; align-items:start; justify-content:start } .item { display:flex; flex-direction:column; box-sizing:border-box } .content { width:100px; height:50px; flex-shrink:0 }</style>
<body><script>
window.referenceReady = (async () => {
  const cases = [];
  const bitmap = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="50"><rect width="100" height="50" fill="red"/></svg>');
  for (const replaced of [false,true]) for (const direction of ['row','row-reverse','column','column-reverse']) {
    for (const cross of [null,20,80]) for (const limit of ['none','specified','maximum','minimum','cross-min','cross-min-zero','cross-max','scroll','hidden','clip']) for(const model of ['plain','border','content']) for (const constraint of ['definite','min-content','max-content']) {
      if(constraint!=='definite' && (limit!=='none' || cross===null)) continue;
      const row = direction.startsWith('row');
      const host = document.createElement('div'); host.className='host';
      host.style.cssText += `;flex-direction:${direction};width:${row?30:240}px;height:${row?240:30}px`;
      if(constraint!=='definite') host.style[row?'width':'height']=constraint;
      const item = document.createElement(replaced?'img':'div'); item.className='item';
      item.style.aspectRatio='2';
      if(model!=='plain') {item.style.padding='5px';item.style.border='2px solid transparent';}
      if(model==='content') item.style.boxSizing='content-box';
      if (replaced) item.src=bitmap;
      else { const content=document.createElement('div'); content.className='content'; item.append(content); }
      const main=row?'width':'height', other=row?'height':'width';
      if (cross!==null) item.style[other]=`${cross}px`;
      if (limit==='specified') item.style[main]='60px';
      if (limit==='maximum') item.style[`max-${main}`]='70px';
      if (limit==='minimum') item.style[`min-${main}`]='10px';
      if (limit==='cross-min') item.style[`min-${other}`]='60px';
      if (limit==='cross-min-zero') item.style[`min-${other}`]='0px';
      if (limit==='cross-max') item.style[`max-${other}`]='30px';
      if (['scroll','hidden','clip'].includes(limit)) item.style.overflow=limit;
      host.append(item); document.body.append(host);
      if(replaced) await item.decode();
      const h=host.getBoundingClientRect(), r=item.getBoundingClientRect();
      cases.push({replaced,direction,cross,limit,model,constraint,actual:[r.x-h.x,r.y-h.y,r.width,r.height]});
      host.remove();
    }
  }
  return {userAgent:navigator.userAgent,cases};
})();
</script>
