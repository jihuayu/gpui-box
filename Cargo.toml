[workspace]
resolver = "3"
members = ["crates/gpui-box", "crates/gpui-box-cli", "crates/gpui-android", "crates/gpui-lifecycle", "crates/gpui-system", "crates/gpui-app-data", "crates/gpui-permissions", "crates/gpui-files", "crates/gpui-activation", "crates/gpui-secrets", "crates/gpui-clipboard", "examples/hello", "examples/android", "examples/desktop", "components/gpui-box-components"]
default-members = ["crates/gpui-box", "crates/gpui-box-cli"]
exclude = ["vendor/gpui"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/jihuayu/gpui-box"
publish = false

[workspace.dependencies]
gpui-box = { path = "crates/gpui-box", default-features = false }
gpui = { path = "vendor/gpui/crates/gpui", default-features = false }
gpui_platform = { path = "vendor/gpui/crates/gpui_platform", default-features = false }
gpui-android = { path = "crates/gpui-android" }
gpui-lifecycle = { path = "crates/gpui-lifecycle", default-features = false }
gpui-system = { path = "crates/gpui-system" }
gpui-files = { path = "crates/gpui-files", default-features = false }
gpui-app-data = { path = "crates/gpui-app-data" }
gpui-permissions = { path = "crates/gpui-permissions", default-features = false }
gpui-activation = { path = "crates/gpui-activation", default-features = false }
gpui-secrets = { path = "crates/gpui-secrets" }
gpui-clipboard = { path = "crates/gpui-clipboard" }
gpui-box-example-hello = { path = "examples/hello" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# Preserve the upstream async scheduler behavior in downstream builds.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

[profile.dev]
debug = "limited"
