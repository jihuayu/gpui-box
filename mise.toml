min_version = "2026.7.5"

[tools]
rust = "1.98.1"

[tasks."setup:rust"]
description = "Install shared Rust development components"
run = "rustup component add rustfmt clippy"

[tasks."setup:android"]
description = "Install Android Rust targets (use mise -E android)"
run = "rustup target add aarch64-linux-android x86_64-linux-android"

[tasks.doctor]
description = "Report development tools and installed Rust targets"
run = [
  "mise --version",
  "git --version",
  "rustc --version",
  "cargo --version",
  "rustup target list --installed",
]

[tasks."doctor:android"]
description = "Report Android language and native build tools (use mise -E android)"
depends = ["doctor"]
run = ["java -version", "cargo ndk --version"]

[tasks.fmt]
description = "Format distribution-owned Rust packages"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check distribution-owned Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.test]
description = "Test distribution-owned library and CLI packages"
run = "cargo test --locked -p gpui-box -p gpui-box-cli -p gpui-android -p gpui-system -p gpui-app-data -p gpui-permissions -p gpui-activation -p gpui-secrets -p gpui-notifications -p gpui-lifecycle -p gpui-sharing -p gpui-clipboard -p gpui-files -p gpui-local-auth -p gpui-updates"

[tasks.lint]
description = "Lint distribution-owned library and CLI packages"
run = "cargo clippy --locked -p gpui-box -p gpui-box-cli -p gpui-android -p gpui-system -p gpui-app-data -p gpui-permissions -p gpui-activation -p gpui-secrets -p gpui-notifications -p gpui-lifecycle -p gpui-sharing -p gpui-clipboard -p gpui-files -p gpui-local-auth -p gpui-updates --all-targets -- -D warnings"

[tasks.build]
description = "Build the shared facade and CLI"
run = "cargo build --locked -p gpui-box -p gpui-box-cli"

[tasks."check:desktop"]
description = "Check the desktop GPUI example and vendored backend"
run = "cargo check --locked -p gpui-box-example-desktop"

[tasks."check:components"]
description = "Test component models and lint the shared gallery"
run = [
  "cargo test --locked -p gpui-box-components",
  "cargo clippy --locked -p gpui-box-components -p gpui-box-example-hello --all-targets -- -D warnings",
]

[tasks."build:desktop"]
description = "Build the desktop GPUI example"
run = "cargo build --locked -p gpui-box-example-desktop"

[tasks."dev:desktop"]
description = "Run the desktop GPUI example"
run = "cargo run --locked -p gpui-box-example-desktop"

[tasks.cli]
description = "Show the distribution CLI information"
run = "cargo run --locked -p gpui-box-cli -- info"

[tasks.check]
description = "Validate configuration, Rust formatting, tests, and lints"
run = [
  "mise tasks validate",
  "cargo fmt --all -- --check",
  "cargo test --locked -p gpui-box -p gpui-box-cli -p gpui-android -p gpui-system -p gpui-app-data -p gpui-permissions -p gpui-activation -p gpui-secrets -p gpui-notifications -p gpui-lifecycle -p gpui-sharing -p gpui-clipboard -p gpui-files -p gpui-local-auth -p gpui-updates",
  "cargo clippy --locked -p gpui-box -p gpui-box-cli -p gpui-android -p gpui-system -p gpui-app-data -p gpui-permissions -p gpui-activation -p gpui-secrets -p gpui-notifications -p gpui-lifecycle -p gpui-sharing -p gpui-clipboard -p gpui-files -p gpui-local-auth -p gpui-updates --all-targets -- -D warnings",
  "git diff --check",
  "git diff --cached --check",
]
