[package]
name = "gpui-box-example-hello"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
accesskit = "0.24.0"
gpui-box-components = { path = "../../components/gpui-box-components" }
gpui-system.workspace = true
gpui-app-data.workspace = true
gpui-lifecycle = { workspace = true, features = ["gpui"] }
gpui-permissions = { workspace = true, features = ["gpui"] }
gpui-files = { workspace = true, features = ["gpui"] }
gpui-activation = { workspace = true, features = ["gpui"] }
gpui-clipboard.workspace = true
gpui-sharing.workspace = true
gpui-notifications = { workspace = true, features = ["gpui"] }
gpui-secrets.workspace = true
gpui-local-auth = { workspace = true, features = ["gpui"] }

[target.'cfg(target_os = "android")'.dependencies]
gpui-android.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
