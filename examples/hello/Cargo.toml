[package]
name = "gpui-box-example-hello"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
retained-wgpu = ["gpui-box/retained-wgpu"]
native-check = ["retained-wgpu", "gpui/test-support", "dep:gpui_platform", "gpui_platform/test-support"]

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-box = { workspace = true, features = ["retained", "retained-text"] }
unicode-segmentation = "1.12"
image = { version = "0.25.10", default-features = false }

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu = { path = "../../vendor/gpui/crates/gpui_wgpu" }
